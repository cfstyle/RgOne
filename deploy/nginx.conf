server {
    listen 80;
    server_name _;
    root /srv/rgone/current/frontend;
    index index.html;
    client_max_body_size 1024M;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rgone_backend backend:8000;
    set $hub_core hub-core:8080;

    location ~ ^/(api(/|$)|health$|openapi\.json$) {
        proxy_pass http://$rgone_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Capability Hub: MCP Streamable HTTP / SSE 长连接通道
    location ~ ^/mcp(/|$) {
        proxy_pass http://$hub_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Capability Hub: REST 管理与门户 API 同源反代
    location /mcp-api/v1/ {
        rewrite ^/mcp-api/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://$hub_core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(docs|redoc)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
